[build-system]
requires = ["pybind11>=2.10.0", "setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddt-core"
version = "1.0.0"
description = "Distributional Decision Trees: A fast, rigorous tree-based model for full distributional forecasting."
authors = [
    {name = "Distributional ML Team"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scikit-learn>=1.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0"
]
