[build-system]
requires = ["setuptools>=64", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "ddt-core"
version = "0.1.0"
description = "Distributional Decision Trees — Pure C++17 ECDF regression via 1D Wasserstein"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Distributional ML Contributors" }
]
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.0",
]

[project.urls]
Homepage = "https://github.com/distributional-ml/ddt-core"
Repository = "https://github.com/distributional-ml/ddt-core.git"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pybind11>=2.10",
]
benchmark = [
    "pandas>=1.3",
    "lightgbm>=3.3",
    "notebook>=6.4",
]

[tool.setuptools]
packages = ["ddt"]
