[build-system]
requires = ["pybind11>=2.10.0", "setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddt-core"
version = "1.1.0"
description = "Distributional Decision Trees: A fast tree-based model for distributional forecasting."
authors = [
    {name = "Distributional ML Team"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scikit-learn>=1.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff==0.16.*"
]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D203", "D212", "D205", "D400", "D415", "D401", "E501", "E402", "E741", "B017", "F821", "F841", "D417", "B007", "B023"]
